version: '3.9'

services:
  # ─── PostgreSQL ───────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: auren-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: auren
      POSTGRES_USER: auren_user
      POSTGRES_PASSWORD: auren_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auren_user -d auren"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - auren-network

  # ─── Redis ────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: auren-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --requirepass auren_redis_dev
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "auren_redis_dev", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - auren-network

  # ─── Keycloak ─────────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: auren-keycloak
    restart: unless-stopped
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/auren
      KC_DB_USERNAME: auren_user
      KC_DB_PASSWORD: auren_dev_password
      KC_DB_SCHEMA: keycloak
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8180
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT_HTTPS: "false"
    ports:
      - "8180:8080"
    command: start-dev --import-realm
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - auren-network

volumes:
  postgres_data:
  redis_data:

networks:
  auren-network:
    driver: bridge
